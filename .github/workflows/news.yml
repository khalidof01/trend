name: بوت الأخبار

on:
  schedule:
    - cron: "*/30 * * * *"   # كل 30 دقيقة
  workflow_dispatch: {}       # زر تشغيل يدوي من تبويب Actions

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: مكتبات الخط العربي
        run: sudo apt-get install -y --no-install-recommends libraqm0 libfribidi0 libharfbuzz0b >/dev/null
      - run: pip install -r requirements.txt
      - name: تشغيل البوت
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python bot.py
      - name: حفظ الحالة
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet || (git commit -m "تحديث الحالة" && git push)
